<style>
/* Layout: one narrow column like a fortune booth — three pages (운세 / 멍기분 / 우리 강아지), the result as a talisman (부적) slip on yellow paper with cinnabar ink. */
:root{
  --bg:#f4f3ef; --surface:#ffffff; --fg:#22211f; --muted:#6c6862; --line:#dedad2;
  --paper:#f3d96b; --paper-ink:#2a2208; --cinnabar:#b8261c; --cinnabar-soft:#b8261c1a;
  --bad:#b8261c;
  --c-angry:#c4511a; --c-happy:#b8261c; --c-relaxed:#5b6e2e; --c-sad:#3d5f8a;
  --font-display:"Nanum Brush Script",cursive;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic","PingFang SC","Microsoft YaHei",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
html[lang="ja"]{--font-display:"Yuji Syuku","Nanum Brush Script",serif}
html[lang="zh"]{--font-display:"Ma Shan Zheng","Nanum Brush Script",cursive}
@media (prefers-color-scheme: dark){:root{
  --bg:#17181b; --surface:#212226; --fg:#ecebe7; --muted:#a29e97; --line:#35363b;
  --paper:#d9bd4f; --paper-ink:#1e1805; --cinnabar:#e2554a; --cinnabar-soft:#e2554a24;
  --bad:#e2554a; --c-angry:#e98a4f; --c-happy:#e2554a; --c-relaxed:#9db35a; --c-sad:#7ea3d4;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
/* language switch */
.langs{display:flex;justify-content:flex-end;gap:2px;margin-bottom:-6px}
.langs button{border:0;background:transparent;padding:4px 8px;font-size:12px;font-weight:600;color:var(--muted);border-radius:6px}
.langs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;font-size:44px;line-height:1.05;margin:0}
html[lang="en"] h1{font-size:38px}
html[lang="ja"] h1{font-size:36px}
.today{font-size:13px;color:var(--muted);text-align:right}
.today b{color:var(--cinnabar);font-weight:600}
.today > span{display:block}
.visits{margin-top:4px;font-size:11px;font-variant-numeric:tabular-nums}
.visits b{font-family:var(--font-data);font-weight:500;color:inherit}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
nav.tabs button{border:0;border-radius:0;background:transparent;padding:10px 4px;font-weight:600;color:var(--muted);font-size:14px}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.page{display:flex;flex-direction:column;gap:18px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.sheet h2 small{font-weight:400;color:var(--muted);font-size:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input[type=text],input[type=date]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
input:focus-visible,button:focus-visible,a:focus-visible,.chip:focus-within,label.btn:focus-within{outline:2px solid var(--cinnabar);outline-offset:2px}
.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
button,label.btn,a.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;font-weight:600;display:inline-block;text-align:center;text-decoration:none}
button.primary,a.btn.primary{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
button.small,label.btn.small{padding:5px 10px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:99px;font-size:13px;background:var(--bg);font-weight:600}
.chip input:checked + span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips .add{padding:5px 12px;border-radius:99px;font-size:13px;border-style:dashed;background:transparent;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:0}
.fun-note{font-size:12px;color:var(--muted);margin:0 0 -12px;text-align:right}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--bad)}
.onboard{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1.5px dashed var(--cinnabar);border-radius:10px;padding:12px 14px}
.onboard > div{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}
.onboard b{font-size:14px}
.onboard span{font-size:12px;color:var(--muted)}
/* avatar */
.av{flex:none;border-radius:50%;overflow:hidden;background:var(--paper);color:var(--cinnabar);display:grid;place-items:center;font-family:var(--font-display);line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.s{width:24px;height:24px;font-size:15px}
.av.m{width:44px;height:44px;font-size:24px}
.av.l{width:56px;height:56px;font-size:30px;border:2px solid var(--cinnabar);background:#fff8}
/* talisman */
.bujeok{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:22px 20px 20px;position:relative;box-shadow:0 1px 0 #0000000f,0 10px 30px -18px #00000066;display:flex;flex-direction:column;gap:16px}
.bujeok::before{content:"";position:absolute;inset:8px;border:1.5px solid var(--cinnabar);border-radius:2px;pointer-events:none;opacity:.8}
.bujeok > *{position:relative}
.b-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.b-id{display:flex;gap:12px;align-items:center;min-width:0}
.b-id > div{min-width:0}
.b-name{font-family:var(--font-display);font-size:34px;line-height:1.05;color:var(--cinnabar);overflow-wrap:anywhere}
.b-sub{font-size:12px;opacity:.75}
.seal{width:84px;height:84px;flex:none;border:3px solid var(--cinnabar);border-radius:6px;color:var(--cinnabar);display:grid;place-items:center;transform:rotate(-4deg);text-align:center;line-height:1}
.seal b{font-family:var(--font-data);font-size:30px;display:block;font-variant-numeric:tabular-nums}
.seal i{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.06em}
.b-theme{border-top:1.5px solid var(--cinnabar);padding-top:8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.b-theme b{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.1;color:var(--cinnabar)}
.b-theme span{font-size:12px;opacity:.75}
.verse{font-size:15px;line-height:1.7;margin:0}
.verse strong{color:var(--cinnabar)}
.lucky{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px}
.lucky div{background:#ffffff40;border-radius:4px;padding:6px 8px;min-width:0}
.lucky b{display:block;font-size:13px}
.luck-why{margin:-8px 0 0;font-size:11px;opacity:.75}
.share-row{display:flex;justify-content:center;margin-top:-6px}
.share-btn{display:inline-flex;align-items:center;gap:6px}
.share-btn svg{width:16px;height:16px}
/* ranking */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li + li{border-top:1px solid var(--line)}
.rank button{width:100%;display:grid;grid-template-columns:28px auto 1fr auto;gap:10px;align-items:center;border:0;border-radius:0;background:transparent;padding:10px 2px;text-align:left;font-weight:400}
.rank .no{font-family:var(--font-data);font-size:15px;color:var(--muted);text-align:center}
.rank li:first-child .no{color:var(--cinnabar);font-weight:700}
.rank .nm{min-width:0}
.rank .nm b{display:block;font-weight:700}
.rank .nm span{font-size:12px;color:var(--muted)}
.rank .nm em{font-style:normal;font-size:11px;color:var(--cinnabar);font-weight:600;margin-left:6px}
.rank .pt{font-family:var(--font-data);font-size:20px;font-variant-numeric:tabular-nums}
/* cropper */
.cropper{position:relative;width:100%;max-width:320px;aspect-ratio:1;margin:0 auto;border-radius:10px;overflow:hidden;background:var(--bg);border:1px dashed var(--line);touch-action:none;user-select:none;cursor:grab}
.cropper.dragging{cursor:grabbing}
.cropper.locked{cursor:default}
.cropper.locked .frame{border-color:var(--cinnabar);box-shadow:0 0 0 999px #00000033}
.cropper canvas{display:block;width:100%;height:100%}
.cropper .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:20px;pointer-events:none}
.cropper .frame{position:absolute;inset:10%;border:2px solid #fff;border-radius:50% 50% 46% 46%;box-shadow:0 0 0 999px #0000004d;pointer-events:none}
.cropper .frame.round{border-radius:50%}
.zoom{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);max-width:320px;width:100%;margin:0 auto}
.zoom input{flex:1}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.photo-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* mood result: a small talisman of its own */
.mood-card{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:18px;position:relative;display:flex;flex-direction:column;gap:10px}
.mood-card::before{content:"";position:absolute;inset:6px;border:1.5px solid var(--cinnabar);border-radius:2px;pointer-events:none;opacity:.8}
.mood-card > *{position:relative}
.mood-head{display:flex;align-items:center;gap:12px}
.mood-head .num{font-family:var(--font-data);font-size:40px;font-variant-numeric:tabular-nums;line-height:1;color:var(--cinnabar)}
.mood-head .lbl{font-family:var(--font-display);font-size:28px;line-height:1.1;color:var(--cinnabar)}
.mood-head .who{font-size:12px;opacity:.75;display:block}
.probs{display:flex;flex-direction:column;gap:6px}
.prob{display:grid;grid-template-columns:76px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.prob .bar{height:10px;border-radius:99px;background:#ffffff66;overflow:hidden}
.prob .bar i{display:block;height:100%;width:0;transition:width .6s ease}
.prob .pct{font-family:var(--font-data);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.hist{display:flex;gap:6px;align-items:flex-end;height:44px}
.hist i{flex:1;background:var(--cinnabar);opacity:.8;border-radius:2px 2px 0 0;min-height:2px}
.hist-l{display:flex;gap:6px;font-size:10px;color:var(--muted);font-family:var(--font-data)}
.hist-l span{flex:1;text-align:center}
.warn{font-size:12px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px;margin:0}
details{font-size:13px}
details summary{cursor:pointer;font-weight:600}
.basis{display:flex;flex-direction:column;gap:10px;margin-top:10px;color:var(--muted)}
.basis p{margin:0}
.basis strong{color:var(--fg)}
.doglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.doglist li{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.doglist li:first-child{border-top:0;padding-top:0}
.doglist .meta{min-width:0}
.doglist .meta b{display:block}
.doglist .meta span{font-size:12px;color:var(--muted)}
.pf{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.empty{font-size:14px;color:var(--muted);text-align:center;padding:12px 0}
.tip{background:var(--bg);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.tip b{color:var(--fg)}
.tip ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.tip strong{color:var(--cinnabar)}
.tip-now{margin:0;font-weight:600;color:var(--cinnabar)}
.tip-now:empty{display:none}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:#000a;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal .box{background:var(--surface);color:var(--fg);border-radius:12px;padding:16px;max-width:420px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal .box img{width:100%;border-radius:6px;display:block;background:var(--paper)}
.modal .box h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center}
footer{font-size:11px;color:var(--muted);line-height:1.6;text-align:center}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){.prob .bar i{transition:none}}
@media (max-width:380px){nav.tabs button{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="langs" aria-label="Language">
    <button type="button" data-lang="ko" lang="ko">한국어</button>
    <button type="button" data-lang="ja" lang="ja">日本語</button>
    <button type="button" data-lang="en" lang="en">English</button>
    <button type="button" data-lang="zh" lang="zh">中文</button>
  </nav>

  <header>
    <h1 data-i18n="title">오늘의 멍운세</h1>
    <div class="today"><span id="today"></span><span class="visits" id="visits" hidden></span></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="페이지">
    <button type="button" role="tab" id="tab-luck" aria-selected="true" aria-controls="page-luck" data-i18n="tabLuck">오늘의 운세</button>
    <button type="button" role="tab" id="tab-mood" aria-selected="false" aria-controls="page-mood" data-i18n="tabMood">멍기분</button>
    <button type="button" role="tab" id="tab-dogs" aria-selected="false" aria-controls="page-dogs" data-i18n="tabDogs">우리 강아지</button>
  </nav>

  <div class="chips" id="dogbar" aria-label="강아지 선택"></div>

  <!-- ===== 1페이지: 오늘의 운세 ===== -->
  <div class="page" id="page-luck" role="tabpanel" aria-labelledby="tab-luck">
    <div class="onboard" id="onboard" hidden>
      <div><b id="onboardTitle"></b><span data-i18n="onboardText"></span></div>
      <button type="button" class="primary" id="onboardBtn" data-i18n="onboardBtn">내 강아지 등록하기</button>
    </div>
    <p class="fun-note" data-i18n="funNote">운세는 재미로 즐겨주세요</p>
    <section class="bujeok" id="bujeok" aria-label="오늘의 운세 결과">
      <div class="b-top">
        <div class="b-id">
          <div class="av l" id="bAv" aria-hidden="true"></div>
          <div>
            <div class="b-name" id="bName"></div>
            <div class="b-sub" id="bSub"></div>
          </div>
        </div>
        <div class="seal"><div><b id="total">··</b><i data-i18n="seal">멍운</i></div></div>
      </div>
      <div class="b-theme"><b id="bTheme"></b><span id="bGod"></span></div>
      <p class="verse" id="verse"></p>
      <div class="lucky">
        <div><span data-i18n="luckyColor">행운의 색</span><b id="lColor"></b></div>
        <div><span data-i18n="luckyPlay">행운의 놀이</span><b id="lItem"></b></div>
        <div><span data-i18n="luckyDir">추천 방향</span><b id="lDir"></b></div>
      </div>
      <p class="luck-why" id="lWhy"></p>
    </section>
    <div class="share-row">
      <button type="button" class="share-btn" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></svg><span data-i18n="share">카드 이미지로 저장·공유</span></button>
    </div>

    <section class="sheet" id="rankSheet" aria-labelledby="h-rank" hidden>
      <h2 id="h-rank"><span data-i18n="rankTitle">오늘의 멍운 순위</span> <small data-i18n="rankSub"></small></h2>
      <ol class="rank" id="rank"></ol>
    </section>

    <details class="sheet">
      <summary data-i18n="basisSummary">점수는 이렇게 계산해요</summary>
      <div class="basis">
        <p data-i18n="basisDay"></p>
        <p data-i18n="basisLuck"></p>
        <p data-i18n="basisNote"></p>
      </div>
    </details>
  </div>

  <!-- ===== 2페이지: 멍기분 ===== -->
  <div class="page" id="page-mood" role="tabpanel" aria-labelledby="tab-mood" hidden>
    <div class="onboard" id="moodNeed" hidden>
      <div><b data-i18n="moodNeedDog"></b></div>
      <button type="button" class="primary" id="moodNeedBtn" data-i18n="onboardBtn">내 강아지 등록하기</button>
    </div>
    <section class="sheet" id="photoSheet" aria-labelledby="h-photo">
      <h2 id="h-photo"><span data-i18n="moodTitle">얼굴로 기분 읽기</span> <small data-i18n="moodSmall"></small></h2>
      <p class="note" data-i18n="moodIntro"></p>
      <div class="cropper" id="cropper">
        <canvas id="cv" width="640" height="640"></canvas>
        <div class="frame" id="frame" hidden></div>

<script src="i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const APP_URL="dayoung227-prog.github.io/meong-fortune";
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const pickIdx=(n,seed)=>hash(seed)%n;

/* ---------- 언어 ---------- */
const I18N=window.MEONG_I18N, LANGS=["ko","ja","en","zh"];
function defaultLang(){const s=store.get("meong.lang");if(LANGS.includes(s))return s;const n=(navigator.language||"ko").toLowerCase();
  if(n.startsWith("ko"))return"ko";if(n.startsWith("ja"))return"ja";if(n.startsWith("zh"))return"zh";return"en"}
let lang=defaultLang();
const D=()=>I18N[lang];
function t(key,vars){let s=D().ui[key];if(s==null)s=I18N.ko.ui[key]||key;if(vars)s=s.replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:m);return s}
const SEP=()=>(lang==="ja"||lang==="zh")?"":" "; // 문장 사이 띄어쓰기 (일본어·중국어는 붙여 씀)
const EN_MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- 만세력 ---------- */
const STEM=["갑","을","병","정","무","기","경","신","임","계"], STEM_H="甲乙丙丁戊己庚辛壬癸";
const BR=["자","축","인","묘","진","사","오","미","신","유","술","해"], BR_H="子丑寅卯辰巳午未申酉戌亥";
const stemEl=s=>Math.floor(s/2);
function jdn(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}
function dayPillar(y,m,d){const i=((jdn(y,m,d)+49)%60+60)%60;return{stem:i%10,br:i%12,idx:i}}
function sunLon(y,m,d){ // apparent solar longitude at 24:00 KST (15:00 UTC): 입춘 당일 출생은 새해로
  const JD=jdn(y,m,d)-0.5+15/24, T=(JD-2451545)/36525, r=Math.PI/180;
  const L0=280.46646+36000.76983*T, M=(357.52911+35999.05029*T)*r;
  const C=(1.914602-0.004817*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const om=(125.04-1934.136*T)*r; let lon=L0+C-0.00569-0.00478*Math.sin(om);
  return ((lon%360)+360)%360}
function yearPillar(y,m,d){let Y=y;if(m===1||(m===2&&sunLon(y,m,d)<315))Y=y-1;return{stem:((Y-4)%10+10)%10,br:((Y-4)%12+12)%12}}
const hanja=p=>STEM_H[p.stem]+BR_H[p.br], hangul=p=>STEM[p.stem]+BR[p.br];
const GODS=["비견","겁재","식신","상관","편재","정재","편관","정관","편인","정인"];
const GOD_BASE=[74,62,86,68,78,82,56,70,64,84];
function tenGod(dayStem,otherStem){ // 십성 번호(0~9)
  const a=stemEl(dayStem),b=stemEl(otherStem),same=(dayStem%2)===(otherStem%2);
  if(a===b)return same?0:1;
  if((a+1)%5===b)return same?2:3;
  if((a+2)%5===b)return same?4:5;
  if((b+2)%5===a)return same?6:7;
  return same?8:9;
}
const LIUHE=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
const SANHE=[[8,0,4],[2,6,10],[5,9,1],[11,3,7]];
function brRel(a,b){
  if(a===b)return null;
  if(LIUHE.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a)))return{k:"육합",pt:10};
  if(Math.abs(a-b)===6)return{k:"충",pt:-12};
  if(SANHE.some(g=>g.includes(a)&&g.includes(b)))return{k:"삼합",pt:6};
  return null;
}
const animalName=br=>D().animalFmt.replace("{a}",D().animals[br]);
const brName=br=>lang==="ko"?BR[br]:BR_H[br];

/* ---------- 오늘 (KST) ---------- */
const parts=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).map(p=>[p.type,p.value]));
const TY=+parts.year,TM=+parts.month,TD=+parts.day, todayKey=`${TY}-${parts.month}-${parts.day}`;
const todayP=dayPillar(TY,TM,TD);
const dateText=()=>t("dateFmt",{y:TY,m:TM,d:TD,M:EN_MONTHS[TM-1]});
const pillarText=()=>t("dayPillar",{ko:hangul(todayP),h:hanja(todayP)});

/* ---------- 강아지 데이터 ---------- */
let dogs=store.get("meong.dogs"); if(!Array.isArray(dogs))dogs=[];
let activeId=store.get("meong.active");
const example=()=>({id:"example",name:D().exampleName,bday:"2021-05-17",noB:false,example:true});
const shown=()=>dogs.length?dogs:[example()];
const active=()=>shown().find(d=>d.id===activeId)||shown()[0];
const saveDogs=()=>store.set("meong.dogs",dogs)&&store.set("meong.active",activeId);
const histKey=id=>"meong.hist."+id;
/* 오늘의 기분 점수는 화면을 보고 있는 동안만 기억함 (새로고침하면 사라짐). 최근 기록 그래프는 따로 저장 */
const moods={};
const getMood=id=>id==="example"?null:(moods[id]||null);
try{Object.keys(localStorage).filter(k=>k.startsWith("meong.mood.")).forEach(k=>localStorage.removeItem(k))}catch(e){}
store.del(histKey("example"));
function avatar(d,size,id){return `<span class="av ${size}"${id?` id="${id}"`:""} aria-hidden="true">${d&&d.photo?`<img src="${d.photo}" alt="">`:esc((d&&d.name||"?").slice(0,1))}</span>`}

/* ---------- 일진운 ---------- */
function dayFortune(dog){
  if(!dog||dog.noB||!dog.bday)return null;
  const [y,m,d]=dog.bday.split("-").map(Number);
  if(!y||!m||!d)return null;
  const dp=dayPillar(y,m,d), yp=yearPillar(y,m,d);
  const g=tenGod(dp.stem,todayP.stem);
  let s=GOD_BASE[g]; const rels=[];
  const r1=brRel(todayP.br,yp.br), r2=brRel(todayP.br,dp.br);
  if(r1){s+=r1.pt;rels.push({n:1,b:todayP.br,yp:yp.br,k:r1.k})}
  if(r2&&!(r1&&r1.k===r2.k)){s+=Math.round(r2.pt/2);rels.push({n:2,b:dp.br,k:r2.k})}
  const li=pickIdx(4,dog.id+"|"+todayKey+"|"+GODS[g]); // 날짜·강아지별 문장 번호 (언어가 바뀌어도 같은 번호)
  return{s:Math.max(5,Math.min(100,s)),g,dp,yp,rels,li};
}
/* 생일이 없으면 오늘 일진과 같은 오행 기준의 십성(비견)으로 문장만 보여줌 */
function relText(r){
  const R=D().rel[r.k];
  return r.n===1?D().relNote1.replace("{b}",brName(r.b)).replace("{animal}",animalName(r.yp)).replace("{r}",R)
                :D().relNote2.replace("{b}",brName(r.b)).replace("{r}",R);
}
function subText(dog,df){
  if(!df)return t("noBdaySub");
  return D().subFmt.replace("{animal}",animalName(df.yp.br)).replace("{ko}",hangul(df.dp)).replace("{h}",hanja(df.dp)).replace("{el}",D().elShort[stemEl(df.dp.stem)]);
}
function dogSummary(d){
  const df=dayFortune(d);
  return df?subText(d,df)+" · "+t("bornFmt",{d:d.bday.replace(/-/g,".")}):t("noBdayList");
}
/* 행운 아이템: 강아지 일간과 오늘 일진의 관계로 오늘 필요한 기운 선택 */
function luckFor(dog,df){
  const tEl=stemEl(todayP.stem); let el=tEl, why=null;
  if(df){
    const me=stemEl(df.dp.stem), gen=x=>(x+1)%5, mother=x=>(x+4)%5;
    if(tEl===me){el=gen(me);why="same"}
    else if(gen(me)===tEl){el=mother(me);why="drain"}
    else if((me+2)%5===tEl){el=me;why="effort"}
    else if((tEl+2)%5===me){el=mother(me);why="pressure"}
    else {el=gen(me);why="receive"}
  }
  const seed=dog.id+"|"+todayKey+"|luck";
  return{el,why,ci:pickIdx(5,seed+"c"),ii:pickIdx(8,seed+"i")};
}
function computeLuck(dog){
  const df=dayFortune(dog), lk=luckFor(dog,df);
  const g=df?df.g:todayP.idx%10; // 생일이 없으면 오늘 일진 번호로 그날의 테마를 고름
  const li=df?df.li:pickIdx(4,todayKey+"|today");
  const theme=D().themes[g], line=D().lines[g][li];
  const verse=[]; // [plain, html]
  if(df){
    verse.push([t("todayTheme",{t:theme}).replace(/<[^>]+>/g,"")+SEP()+line, t("todayTheme",{t:esc(theme)})+SEP()+esc(line)]);
    if(df.rels.length){let s=df.rels.map(relText).join(D().relJoin||", ")+D().relTail;s=s.charAt(0).toUpperCase()+s.slice(1);verse.push([s,esc(s)])}
  }else{
    verse.push([line,esc(line)]);
  }
  return{dog,df,total:df?df.s:null,theme,god:df?D().godNames[g]:"",sub:subText(dog,df),verse,
    luck:{el:D().els[lk.el],dir:D().dirs[lk.el],color:D().colors[lk.el][lk.ci],item:D().items[lk.el][lk.ii],why:lk.why?D().why[lk.why]:null}};
}

/* ---------- 번역 적용 ---------- */
function applyI18n(){
  document.documentElement.lang=lang;
  document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.innerHTML=t(el.dataset.i18n)});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("fName").placeholder=t("fNamePh");
  $("today").innerHTML=`${esc(dateText())}<br><b>${esc(pillarText())}</b>`;
  renderVisits();
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{
  lang=b.dataset.lang; store.set("meong.lang",lang); applyI18n(); showTab(curTab,true);
});

/* ---------- 탭 ---------- */
let curTab="luck";
function showTab(which,keep){
  curTab=which;
  ["luck","mood","dogs"].forEach(p=>{$("page-"+p).hidden=p!==which;$("tab-"+p).setAttribute("aria-selected",p===which)});
  $("dogbar").hidden=which==="dogs";
  if(which!=="mood"&&!keep)resetPhoto();
  if(which==="dogs")renderDogs();else if(which==="mood")renderMoodPage();else renderLuck();
}
$("tab-luck").onclick=()=>showTab("luck");
$("tab-mood").onclick=()=>showTab("mood");
$("tab-dogs").onclick=()=>showTab("dogs");

function selectDog(id){activeId=id;saveDogs();resetPhoto();showTab(curTab,true)}
function renderDogbar(){
  const a=active();
  $("dogbar").innerHTML=shown().map(d=>`<label class="chip"><input type="radio" name="dogpick" value="${esc(d.id)}" ${d.id===a.id?"checked":""}><span>${avatar(d,"s")}${esc(d.name)}${d.example?esc(t("exampleTag")):""}</span></label>`).join("")+`<button type="button" class="add" id="barAdd">${esc(t("addChip"))}</button>`;
  $("dogbar").querySelectorAll("input[name=dogpick]").forEach(r=>r.addEventListener("change",()=>selectDog(r.value)));
  $("barAdd").onclick=()=>goRegister(false);
}

/* ---------- 1. 오늘의 운세 ---------- */
function renderLuck(){
  renderDogbar();
  const L=computeLuck(active()), {dog,df}=L;
  $("bAv").outerHTML=avatar(dog,"l","bAv");
  $("bName").textContent=dog.name;
  $("bSub").textContent=L.sub+(dog.example?" · "+t("exampleSub"):"");
  $("total").textContent=L.total!=null?L.total:"··";
  $("bTheme").textContent=L.theme; $("bGod").textContent=df?L.god:"";
  const v=L.verse.map(x=>x[1]);
  if(!df)v.push(esc(t("needBday",{n:dog.name})));
  $("verse").innerHTML=v.join(SEP());
  $("lColor").textContent=L.luck.color;$("lItem").textContent=L.luck.item;$("lDir").textContent=L.luck.dir;
  $("lWhy").textContent=df?t("luckWhy",{n:dog.name,el:L.luck.el,why:L.luck.why}):t("luckWhyNoBday",{n:dog.name,el:L.luck.el});
  $("onboard").hidden=!!dogs.length;
  $("onboardTitle").textContent=t("onboardTitle",{n:D().exampleName});
  renderRank();
}
function renderRank(){
  if(dogs.length<2){$("rankSheet").hidden=true;return}
  $("rankSheet").hidden=false;
  const rows=dogs.map(d=>computeLuck(d)).sort((a,b)=>(b.total??-1)-(a.total??-1));
  const cur=active().id;
  $("rank").innerHTML=rows.map((r,i)=>`<li><button type="button" data-id="${esc(r.dog.id)}"><span class="no">${i+1}</span>${avatar(r.dog,"m")}<span class="nm"><b>${esc(r.dog.name)}${r.dog.id===cur?`<em>${esc(t("rankNow"))}</em>`:""}</b><span>${esc(r.df?r.theme:t("rankNeedBday"))}</span></span><span class="pt">${r.total??"–"}</span></button></li>`).join("");
  $("rank").querySelectorAll("button").forEach(b=>b.onclick=()=>{selectDog(b.dataset.id);$("bujeok").scrollIntoView({behavior:"smooth",block:"start"})});
}

/* ---------- 2. 멍기분 ---------- */
function renderMoodPage(){
  renderDogbar();
  const has=!!dogs.length;
  $("moodNeed").hidden=has;
  $("photoSheet").querySelectorAll("button,input").forEach(el=>{el.disabled=!has||(el.id==="analyze"&&(!faceCrop.loaded||faceCrop.locked))});
  $("pickLbl").textContent=faceCrop.locked?t("pickAgain"):t("pick");
  renderMood(active(),getMood(active().id));
}
function renderMood(dog,mood){
  if(!mood){$("moodBox").hidden=true}else{
    $("moodBox").hidden=false;
    const tx=moodTextFor(mood);
    $("mNum").textContent=mood.score;$("mWho").textContent=t("moodNow",{n:dog.name});$("mLbl").textContent=tx[0];

/* ---------- 사진 맞추기 (기분 분석·프로필 공용) ---------- */
function makeCropper(box,zoomEl){
  const cv=box.querySelector("canvas"), ctx=cv.getContext("2d"), FR={x:0.1,y:0.1,s:0.8};
  let img=null,scale=1,base=1,ox=0,oy=0,drag=null,pinch=null,locked=false; const pts=new Map();
  const draw=()=>{ctx.clearRect(0,0,cv.width,cv.height);if(img)ctx.drawImage(img,ox,oy,img.width*base*scale,img.height*base*scale)};
  const clamp=()=>{const w=img.width*base*scale,h=img.height*base*scale,W=cv.width,fx=FR.x*W,fy=FR.y*W,fs=FR.s*W;
    ox=Math.min(fx,Math.max(fx+fs-w,ox));oy=Math.min(fy,Math.max(fy+fs-h,oy))};
  const setZoom=z=>{if(!img)return;const c=cv.width/2,ix=(c-ox)/(base*scale),iy=(c-oy)/(base*scale);scale=z;ox=c-ix*base*scale;oy=c-iy*base*scale;clamp();draw()};
  const toCanvas=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  zoomEl.addEventListener("input",e=>{if(!locked)setZoom(Number(e.target.value))});
  box.addEventListener("pointerdown",e=>{if(!img||locked)return;box.setPointerCapture(e.pointerId);pts.set(e.pointerId,toCanvas(e));
    if(pts.size===1){const p=toCanvas(e);drag={x:p.x,y:p.y,ox,oy};box.classList.add("dragging")}
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:scale};drag=null}});
  box.addEventListener("pointermove",e=>{if(!img||locked||!pts.has(e.pointerId))return;pts.set(e.pointerId,toCanvas(e));
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const z=Math.max(1,Math.min(4,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));zoomEl.value=z;setZoom(z);return}
    if(drag){const p=toCanvas(e);ox=drag.ox+(p.x-drag.x);oy=drag.oy+(p.y-drag.y);clamp();draw()}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){drag=null;box.classList.remove("dragging")}};
  box.addEventListener("pointerup",up);box.addEventListener("pointercancel",up);
  box.addEventListener("wheel",e=>{if(!img||locked)return;e.preventDefault();const z=Math.max(1,Math.min(4,scale*(e.deltaY<0?1.08:0.92)));zoomEl.value=z;setZoom(z)},{passive:false});
  return{
    get loaded(){return!!img},
    get locked(){return locked},
    lock(v){locked=!!v;box.classList.toggle("locked",locked)}, // 분석 후 위치 고정
    load(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
      im.onload=()=>{img=im;const W=cv.width;base=(FR.s*W)/Math.min(im.width,im.height);scale=1;zoomEl.value=1;ox=(W-im.width*base)/2;oy=(W-im.height*base)/2;clamp();draw();res()};
      im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"))};im.src=url})},
    crop(size){const out=document.createElement("canvas");out.width=out.height=size;const W=cv.width;
      out.getContext("2d").drawImage(img,(FR.x*W-ox)/(base*scale),(FR.y*W-oy)/(base*scale),(FR.s*W)/(base*scale),(FR.s*W)/(base*scale),0,0,size,size);return out},
    reset(){img=null;locked=false;box.classList.remove("locked");zoomEl.value=1;ctx.clearRect(0,0,cv.width,cv.height)}
  };
}

async function loadModel(){

let dogNet=null, dogNetFailed=false;
const DOGNET_URL="https://tfhub.dev/google/tfjs-model/imagenet/mobilenet_v2_050_224/classification/3/default/1";
async function loadDogNet(){
  if(dogNet||dogNetFailed)return dogNet;
  try{dogNet=await tf.loadGraphModel(DOGNET_URL,{fromTFHub:true})}catch(e){dogNetFailed=true;console.warn("dog check unavailable",e)}
  return dogNet;

function dogProbability(canvas){ // ImageNet 개 품종(151~268번) 확률 합. 출력 1001개 중 0번은 배경.
  return tf.tidy(()=>{
    const x=tf.browser.fromPixels(canvas).toFloat().div(255).expandDims(0);
    let out=dogNet.predict(x); if(Array.isArray(out))out=out[0];
    const p=tf.softmax(out).dataSync(), off=p.length===1001?1:0;
    let s=0; for(let i=151;i<=268;i++)s+=p[i+off];
    return s;
  });
}
const VALUE={happy:92,relaxed:80,sad:35,angry:15};
function soften(p,T){const l=p.map(x=>Math.log(Math.max(x,1e-7))/T),m=Math.max(...l),e=l.map(x=>Math.exp(x-m)),s=e.reduce((a,b)=>a+b,0);return e.map(x=>x/s)}

async function analyze(force){
  if(!faceCrop.loaded||!dogs.length)return;
  const dog=active();
  $("analyze").disabled=true; $("forceRow").hidden=true;
  setStatus(model?t("stAnalyzing"):t("stLoading"));
  try{
    const [m,dn]=await Promise.all([loadModel(),force?null:loadDogNet()]);
    setStatus(t("stAnalyzing"));
    const face=faceCrop.crop(224);
    if(dn&&!force){
      if(dogProbability(face)<0.1){setStatus(t("stNoDog"),true);$("forceRow").hidden=false;return}
    }
    const raw=tf.tidy(()=>m.predict(tf.browser.fromPixels(face).toFloat().sub(127.5).div(127.5).expandDims(0)).dataSync());
    const p=soften(Array.from(raw),3);
    const probs=labels.map((k,i)=>({k,v:p[i]})).filter(x=>VALUE[x.k]!==undefined);
    const score=Math.round(probs.reduce((a,x)=>a+x.v*VALUE[x.k],0));
    const top=probs.slice().sort((a,b)=>b.v-a.v)[0].k;
    const lvl=(top==="happy"||top==="relaxed")?(score>=80?0:1):(score>=35?0:1);
    moods[dog.id]={date:todayKey,score,top,lvl,ti:pickIdx(3,dog.id+"|"+todayKey+"|"+top),probs:probs.sort((a,b)=>b.v-a.v)};
    const h=(store.get(histKey(dog.id))||[]).filter(x=>x.date!==todayKey); h.push({date:todayKey,score}); store.set(histKey(dog.id),h.slice(-30));
    setStatus(t("stDone"));

const CARD={paper:"#f3d96b",ink:"#2a2208",red:"#b8261c",soft:"#fbefb4"};
function wrapLines(c,text,maxW){ // 띄어쓰기 단위로 줄바꿈 (일본어·중국어처럼 띄어쓰기가 없으면 글자 단위)
  const out=[];let line="";
  const words=/\s/.test(text)?text.split(/\s+/):[...text];
  const joiner=/\s/.test(text)?" ":"";
  for(const word of words){
    const tt=line?line+joiner+word:word;
    if(c.measureText(tt).width<=maxW||(line&&NO_START.includes(word))){line=tt;continue}
    if(line)out.push(line);
    if(c.measureText(word).width<=maxW){line=word;continue}
    line="";for(const ch of word){if(c.measureText(line+ch).width>maxW&&line&&!NO_START.includes(ch)){out.push(line);line=ch}else line+=ch} // 。、 같은 문장부호는 줄 첫머리에 오지 않게
  }
  if(line)out.push(line);return out;
}

  g.font=`700 28px ${SANS}`;g.fillText(t("seal"),0,70);g.restore();g.textAlign="left";
  // 오늘의 테마
  g.strokeStyle=CARD.red;g.lineWidth=3;g.beginPath();g.moveTo(84,488);g.lineTo(W-84,488);g.stroke();
  g.fillStyle=CARD.red;fitFont(g,L.theme,`{s}px ${BRUSH}`,88,680);g.fillText(L.theme,84,590);
  if(df){const tw=g.measureText(L.theme).width;g.fillStyle=CARD.ink;g.globalAlpha=.75;g.font=`400 28px ${SANS}`;g.fillText(L.god,84+tw+24,588);g.globalAlpha=1}
  // 운세 문장
  const verse=L.verse.map(x=>x[0]).concat(df?[]:[t("cardNoBday")]).join(SEP());
  g.fillStyle=CARD.ink;g.font=`400 38px ${SANS}`;
  let lines=wrapLines(g,verse,W-168); if(lines.length>8){lines=lines.slice(0,8);lines[7]=lines[7].replace(/.$/,"…")}
  lines.forEach((ln,i)=>g.fillText(ln,84,690+i*60));
  // 행운
  const lk=[[t("luckyColor"),L.luck.color],[t("luckyPlay"),L.luck.item],[t("luckyDir"),L.luck.dir]];
  lk.forEach(([k,v],i)=>{const x=84+i*(296+12);g.fillStyle="rgba(255,255,255,.35)";g.fillRect(x,1126,296,132);
    g.fillStyle=CARD.ink;g.globalAlpha=.75;g.font=`400 24px ${SANS}`;g.fillText(k,x+18,1164);g.globalAlpha=1;
    g.font=`700 30px ${SANS}`;
    if(g.measureText(v).width<=260){g.fillText(v,x+18,1212)}
    else{g.font=`700 26px ${SANS}`;wrapLines(g,v,260).slice(0,2).forEach((ln,j)=>g.fillText(ln,x+18,1204+j*34))}});
  // 바닥
  g.fillStyle=CARD.ink;g.globalAlpha=.65;g.textAlign="center";g.font=`400 22px ${SANS}`;g.fillText(`${t("cardFoot")} · ${APP_URL}`,W/2,1296);g.globalAlpha=1;g.textAlign="left";
  return new Promise(r=>c.toBlob(r,"image/png"));
}
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let shareBlob=null, shareUrl=null, lastFocus=null;
$("shareBtn").onclick=async()=>{
  const b=$("shareBtn"); b.disabled=true; lastFocus=b;
  try{
    shareBlob=await drawCard(); if(!shareBlob)throw new Error("blob");
    if(shareUrl)URL.revokeObjectURL(shareUrl); shareUrl=URL.createObjectURL(shareBlob);
    const name=`meong-fortune-${todayKey}.png`;
    $("shareImg").src=shareUrl; $("shareImg").alt=t("title"); $("shareSave").href=shareUrl; $("shareSave").download=name;
    const file=new File([shareBlob],name,{type:"image/png"});
    const canShareFile=!!(navigator.canShare&&navigator.canShare({files:[file]}));
    // 아이폰: 웹에서 사진첩 직접 저장이 막혀 있어 공유 메뉴의 '이미지 저장'이나 길게 눌러 저장으로 안내
    if(isIOS){
      $("shareSave").hidden=true; $("shareNative").hidden=!canShareFile; $("shareNative").textContent=t("shareIOSBtn");
      $("shareNote").innerHTML=canShareFile?t("shareNoteIOS"):t("shareNoteIOSNo");
    }else{
      $("shareSave").hidden=false; $("shareNative").hidden=!canShareFile; $("shareNative").textContent=t("shareBtn");
      $("shareNote").textContent=t("shareNote");
    }
    $("shareNative").onclick=async()=>{try{await navigator.share({files:[file]})}catch(e){}};
    $("shareModal").hidden=false; $("shareClose").focus();
  }catch(e){console.error(e)}finally{b.disabled=false}
};
function closeShare(){$("shareModal").hidden=true;if(lastFocus)lastFocus.focus()}
$("shareClose").onclick=closeShare;
$("shareModal").addEventListener("click",e=>{if(e.target===$("shareModal"))closeShare()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("shareModal").hidden)closeShare();if(!$("pfModal").hidden)closePf()});

/* ---------- 홈 화면에 추가 (PWA) ---------- */
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
let deferredPrompt=null, installedNow=false;
function renderInstall(){
  if(standalone){$("installSheet").hidden=true;return}
  if(installedNow){$("installText").textContent=t("installed");$("installBtn").hidden=true;return}
  $("installBtn").hidden=!deferredPrompt;
  $("installText").textContent=deferredPrompt?t("installText"):(isIOS?t("installIOS"):t("installOther"));
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;renderInstall()});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;installedNow=true;renderInstall()});
$("installBtn").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;renderInstall()};
if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname)){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
